version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Local development üçün təhlükəsizliyi söndürürük
      - xpack.license.self_generated.type=basic # Tamamilə pulsuz lisenziya rejimini aktiv edirik
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Kompüterinizin RAM-ını qorumaq üçün limit
    ports:
      - "127.0.0.1:9200:9200" # Təhlükəsizlik üçün portu yalnız local kompüterinizə bağlayırıq
      - "127.0.0.1:9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data # Konteyner silinsə belə datalarınız silinməyəcək
    networks:
      - elastic

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1 # Versiyanı Elasticsearch ilə eyniləşdirdik
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - elastic

volumes:
  elasticsearch-data:
    driver: local

networks:
  elastic:
    driver: bridge
